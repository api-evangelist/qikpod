aid: qikpod
name: QikPod
description: 'QikPod was an Accel-backed Indian startup that built an automated parcel
  locker network for last-mile e-commerce delivery, letting shoppers collect and return
  packages from unattended smart lockers placed in apartments, offices, and retail
  locations. The company has since rebranded and pivoted to Leapmile Robotics, a nano-warehouse
  automation and intelligent fulfillment platform that uses robotics to handle storage,
  retrieval, picking, auditing, and dispatch inside compact autonomous warehouse facilities.
  The legacy qikpod.com domain now redirects to leapmile.com/qikpod. This profile is
  maintained in the API Evangelist network as a company lead; no public developer
  API surface has been found for either the QikPod or Leapmile properties.'
